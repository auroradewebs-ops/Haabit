<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="auraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B4789"/>
      <stop offset="50%" stop-color="#1E3264"/>
      <stop offset="100%" stop-color="#121F40"/>
    </linearGradient>
    <linearGradient id="auraPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8BB5"/>
      <stop offset="100%" stop-color="#E36D9B"/>
    </linearGradient>
    <linearGradient id="auraYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275"/>
      <stop offset="100%" stop-color="#E7DD6A"/>
    </linearGradient>
    <linearGradient id="auraGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00CB75"/>
      <stop offset="100%" stop-color="#10B183"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base with Rounded App Icon Style -->
  <rect width="512" height="512" rx="128" fill="url(#auraBg)"/>
  
  <!-- Whimsical Organic Circles / Petals -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#E7DD6A" stroke-width="4" stroke-dasharray="8 8" opacity="0.3"/>
  <circle cx="256" cy="256" r="145" fill="none" stroke="#00CB75" stroke-width="6" opacity="0.4"/>
  
  <!-- Sunburst / Whimsical Petal Shapes -->
  <circle cx="256" cy="140" r="54" fill="url(#auraPink)" opacity="0.95"/>
  <circle cx="356" cy="210" r="50" fill="url(#auraYellow)" opacity="0.9"/>
  <circle cx="320" cy="340" r="52" fill="url(#auraGreen)" opacity="0.95"/>
  <circle cx="192" cy="340" r="52" fill="url(#auraPink)" opacity="0.9"/>
  <circle cx="156" cy="210" r="50" fill="url(#auraGreen)" opacity="0.9"/>

  <!-- Center Timer & Growth Core -->
  <circle cx="256" cy="256" r="64" fill="#FAF8F5" filter="url(#softGlow)"/>
  
  <!-- Stylized Hourglass / Sprout in Center -->
  <path d="M256 218 C240 218 232 232 232 244 C232 262 256 270 256 270 C256 270 280 262 280 244 C280 232 272 218 256 218 Z" fill="#2B4789" />
  <path d="M256 294 C240 294 232 280 232 268 C232 250 256 242 256 242 C256 242 280 250 280 268 C280 280 272 294 256 294 Z" fill="#E36D9B" opacity="0.85"/>
  
  <circle cx="256" cy="256" r="6" fill="#E7DD6A"/>
</svg>
